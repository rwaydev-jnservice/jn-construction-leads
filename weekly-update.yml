name: Weekly Permit Update

on:
  schedule:
    # Every Monday at 8:00 AM Eastern (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-permits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch new permits
        run: python fetch_permits.py

      - name: Build dashboard HTML
        run: python build_dashboard.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "JN Leads Bot"
          git add data/permits.json docs/index.html
          git diff --staged --quiet || git commit -m "Weekly update: $(date '+%Y-%m-%d')"
          git push
